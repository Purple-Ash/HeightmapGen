name: ci.yml

on: [push]

jobs:
  linux-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Configure
        run: cmake ./HeightmapGenerator -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ./Tests
