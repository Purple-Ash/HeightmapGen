name: ci.yml

on: [push]

jobs:
  heightmap-generator-linux-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3 libx11-dev libxcursor-dev libgl-dev

      - name: Configure
        run: cmake ./HeightmapGenerator -B build -DHEIGHTMAP_BUILD_VIEWER=ON -DGLAD_REPRODUCIBLE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: cd build && ./Tests

  dataset-generator-linux-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Configure
        run: cmake ./DatasetGenerator -B build

      - name: Build
        run: cmake --build build --parallel
